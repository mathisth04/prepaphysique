<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Prépa 4 Sem" />
  <meta name="theme-color" content="#09090b" />
  <title>Prépa 4 Semaines • Volley & Renfo</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121216;
      --surface-elevated: #1c1c22;
      --border: #27272f;
      --text: #f4f4f6;
      --text-muted: #9ca3af;
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.15);
      --blue: #3b82f6;
      --amber: #f59e0b;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-top: calc(var(--safe-top) + 12px);
      padding-bottom: calc(var(--safe-bottom) + 84px);
      overflow-x: hidden;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .header-title h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-title p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: capitalize;
    }

    .progress-pill {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-pill.done {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Day Selector Strip */
    .day-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 18px;
    }

    .day-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 0;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .day-btn span.num {
      font-size: 0.95rem;
      color: var(--text);
    }

    .day-btn.active {
      background: var(--surface-elevated);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .day-btn.today-marker span.num {
      color: var(--accent);
    }

    .day-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: transparent;
    }

    .day-dot.completed {
      background: var(--accent);
    }

    /* Session Card */
    .session-banner {
      background: linear-gradient(145deg, var(--surface-elevated), var(--surface));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .session-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .session-banner h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .session-note {
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Variant / Options Switcher */
    .options-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .chip-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip-btn.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Warmup & Objectives Accordion */
    .info-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .info-box strong {
      color: var(--text);
    }

    /* Section Header */
    .block-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin: 18px 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Exercise List */
    .exo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .exo-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.1s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .exo-item:active {
      transform: scale(0.99);
    }

    .exo-item.checked {
      border-color: rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.04);
    }

    .exo-name-area {
      flex: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .exo-name {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text);
      transition: color 0.15s ease;
    }

    .exo-item.checked .exo-name {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .exo-chevron {
      color: var(--text-muted);
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .check-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .exo-item.checked .check-btn {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check-btn svg {
      width: 15px;
      height: 15px;
      stroke: #052e16;
      stroke-width: 3;
      fill: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .exo-item.checked .check-btn svg {
      opacity: 1;
    }

    /* Calendar View */
    .calendar-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .cal-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .cal-nav {
      display: flex;
      gap: 8px;
    }

    .cal-nav button {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .cal-cell {
      aspect-ratio: 1;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }

    .cal-cell.empty {
      background: transparent;
      cursor: default;
    }

    .cal-cell.is-today {
      border-color: var(--blue);
      background: rgba(59, 130, 246, 0.12);
      color: #93c5fd;
    }

    .cal-cell.is-selected {
      box-shadow: 0 0 0 2px var(--text);
    }

    .cal-badge {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: transparent;
    }

    .cal-badge.green {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .cal-legend {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 18, 22, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 10px 24px calc(var(--safe-bottom) + 8px);
      display: flex;
      justify-content: space-around;
      z-index: 50;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--accent);
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
    }

    /* Modal Bottom Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface-elevated);
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 14px 20px calc(var(--safe-bottom) + 24px);
      animation: slideUp 0.22s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      margin: 0 auto 16px;
    }

    .modal-sheet h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .metric-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .metric-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 700;
    }

    .metric-val {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent);
    }

    .modal-instructions {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 18px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: #052e16;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <h1>Prépa 4 Semaines</h1>
        <p id="currentDateLabel">Aujourd'hui</p>
      </div>
      <div class="progress-pill" id="headerProgress">0 / 0</div>
    </header>

    <!-- VUE DU JOUR -->
    <main id="todayView">
      <div class="day-strip" id="weekStrip"></div>

      <div class="session-banner">
        <span class="session-tag" id="dayNameTag">Lundi</span>
        <h2 id="sessionTitle">Titre de la séance</h2>
        <p class="session-note" id="sessionNote">Consignes du jour</p>
        <div class="options-bar" id="optionsBar"></div>
      </div>

      <div class="info-box" id="warmupBox"></div>

      <div id="exerciseSections"></div>
    </main>

    <!-- VUE CALENDRIER -->
    <section id="calendarView" class="hidden">
      <div class="calendar-card">
        <div class="cal-header">
          <h2 id="calMonthTitle">Mois Année</h2>
          <div class="cal-nav">
            <button id="prevMonthBtn" aria-label="Mois précédent">‹</button>
            <button id="nextMonthBtn" aria-label="Mois suivant">›</button>
          </div>
        </div>
        <div class="cal-weekdays">
          <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend">
          <div class="legend-item">
            <span style="width:10px;height:10px;border-radius:3px;border:1px solid #3b82f6;background:rgba(59,130,246,0.2);display:inline-block;"></span>
            Aujourd'hui
          </div>
          <div class="legend-item">
            <span class="cal-badge green"></span>
            Séance 100 % validée
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- NAVIGATION BASSE -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="navToday">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      <span>Séance</span>
    </button>
    <button class="nav-btn" id="navCalendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>Calendrier</span>
    </button>
  </nav>

  <!-- MODALE DÉTAILS EXERCICE -->
  <div class="modal-backdrop" id="exoModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3 id="modalTitle">Nom de l'exercice</h3>
      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">Séries</div>
          <div class="metric-val" id="modalSets">-</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Répétitions</div>
          <div class="metric-val" id="modalReps">-</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Repos</div>
          <div class="metric-val" id="modalRest">-</div>
        </div>
      </div>
      <div class="modal-instructions" id="modalDesc">Consignes détaillées</div>
      <div class="modal-actions">
        <button class="btn-secondary" id="closeModalBtn">Fermer</button>
        <button class="btn-primary" id="toggleDoneModalBtn">Valider l'exercice</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // BASE DE DONNÉES DU PROGRAMME
    // ==========================================
    const WORKOUT_BLOCKS = {
      hc1: {
        title: "Séance Haut du Corps 1",
        warmup: "<strong>Échauffement :</strong> Mobilisation articulaire haut du corps uniquement (avec élastique).<br><strong>Consignes :</strong> Garde le dos bien droit tout le long. Garde minimum <strong>2 reps dans la poche</strong> (surtout sur les pompes). Fais toutes les séries d'un exo avant de passer au suivant.<br><strong>Objectifs :</strong> Pectoraux, Dos, Triceps, Épaules, Biceps.",
        exercises: [
          {
            id: "hc1_pompes",
            name: "Pompes (bras le long du buste)",
            sets: "4 séries",
            reps: "8 à 15 reps",
            rest: "1 min 30",
            desc: "Coudes proches du buste (pas écartés à 90°), corps parfaitement gainé de la tête aux talons. Garde au moins 2 répétitions en réserve à chaque série."
          },
          {
            id: "hc1_rowing",
            name: "Rowing avec élastique",
            sets: "4 séries",
            reps: "12 à 15 reps",
            rest: "1 min",
            desc: "ATTENTION AU DOS : garde la colonne neutre et les abdos engagés. Tire les coudes vers l'arrière en serrant fort les omoplates en fin de mouvement."
          },
          {
            id: "hc1_diamant",
            name: "Pompes diamants",
            sets: "4 séries",
            reps: "6 à 12 reps",
            rest: "1 min 30",
            desc: "Mains rapprochées sous la poitrine (pouces et index formant un triangle). Descends en contrôlant, coudes serrés, sans creuser le bas du dos."
          },
          {
            id: "hc1_epaules",
            name: "Développé épaules avec bouteilles",
            sets: "3 séries",
            reps: "10 à 12 reps",
            rest: "1 min",
            desc: "Dos droit, tronc gainé, bras alignés avec le buste/oreilles. Pousse les bouteilles au-dessus de la tête sans cambrer les lombaires."
          },
          {
            id: "hc1_curl",
            name: "Curl biceps avec élastique",
            sets: "3 séries",
            reps: "10 à 12 reps",
            rest: "1 min",
            desc: "Élastique bloqué sous les pieds. Coudes fixes collés aux côtes, fléchis les avant-bras sans balancer le buste."
          },
          {
            id: "hc1_triceps",
            name: "Extension triceps",
            sets: "3 séries",
            reps: "10 à 12 reps",
            rest: "1 min",
            desc: "À l'élastique (au-dessus de la tête ou poussée vers le bas). Garde les coudes fixes et verrouille bien l'extension."
          }
        ]
      },
      hc2: {
        title: "Séance Haut du Corps 2",
        warmup: "<strong>Échauffement :</strong> Mobilisation articulaire haut du corps (avec élastique).<br><strong>Consignes :</strong> 1 min 30 de repos partout, <strong>1 à 2 reps dans la poche MINIMUM</strong>.<br><strong>Objectifs :</strong> Dos, Épaisseur musculaire, Épaules (faisceau latéral), Pectoraux supérieurs, Bras.",
        exercises: [
          {
            id: "hc2_pompes_sup",
            name: "Pompes pieds surélevés",
            sets: "3 séries",
            reps: "8 à 12 reps",
            rest: "1 min 30",
            desc: "Pieds posés sur un support stable (lit, chaise). Reste parfaitement droit et gainé pour cibler le haut des pectoraux."
          },
          {
            id: "hc2_rowing_uni",
            name: "Rowing unilatéral",
            sets: "4 séries",
            reps: "10 à 12 / bras",
            rest: "1 min 30",
            desc: "Avec haltère/bouteille lourde ou élastique. DOS DROIT obligatoire, buste penché stable, tire le coude le long du flanc."
          },
          {
            id: "hc2_elev_lat",
            name: "Élévations latérales",
            sets: "3 séries",
            reps: "12 à 20 reps",
            rest: "1 min 30",
            desc: "Avec ou sans poids (bouteilles/élastique). Monte les bras sur les côtés jusqu'à hauteur d'épaules, coudes légèrement fléchis, sans donner d'élan."
          },
          {
            id: "hc2_pull_apart",
            name: "Pull-apart avec élastique",
            sets: "3 séries",
            reps: "15 à 20 reps",
            rest: "1 min 30",
            desc: "Bras tendus devant toi à hauteur d'épaules, écarte l'élastique en resserrant les omoplates. Épaules basses."
          },
          {
            id: "hc2_curl",
            name: "Curl biceps avec élastique",
            sets: "3 séries",
            reps: "12 à 15 reps",
            rest: "1 min 30",
            desc: "Élastique sous les pieds, contrôle la descente sur 2 secondes, coudes fixes."
          },
          {
            id: "hc2_dips",
            name: "Dips entre deux chaises",
            sets: "3 séries",
            reps: "10 à 12 reps",
            rest: "1 min 30",
            desc: "Entre deux chaises stables de même hauteur (ou extension triceps à l'élastique). Descends jusqu'à avoir les bras à 90° en gardant les épaules basses."
          }
        ]
      },
      bbl: {
        title: "Séance Bas du Corps (BBL)",

          {

            sets: "3 séries",

          },
          {
            id: "abs_climber",
            name: "Mountain Climber",
            sets: "3 séries",
            reps: "30 sec",

      },
      tractions: {

        warmup: "<strong>Note :</strong> À faire après la séance si tu n'es pas trop cramé. <strong>1 min 30 à 2 min</strong> de récup entre les exos (force pure).",
        exercises: [
          {

          },
          {

            reps: "45 sec",

          },
          {
            id: "trac_susp_90",
            name: "Suspension coudes à 90°",
            sets: "1 série",
            reps: "À l'échec",
            rest: "Fin",
            desc: "Tiens la position bras fléchis à angle droit (90°) jusqu'à l'échec musculaire complet."
          }
        ]
      },
      volley_lundi: {
        title: "Volley + Étirements",
        warmup: "<strong>Focus du jour :</strong> Entraînement de volley puis séance d'étirements complets en fin de journée pour favoriser la récupération.",
        exercises: [
          {
            id: "vol_lun_1",
            name: "Séance Volley-ball",

            reps: "Complète",

            desc: "Échauffement spécifique épaules/chevilles avant de frapper fort. Hydrate-toi bien pendant la séance."
          },
          {
            id: "vol_lun_2",
            name: "Routine Étirements post-volley",
            sets: "15 min",
            reps: "30-45s / muscle",
            rest: "-",
            desc: "Étirements doux (sans forcer jusqu'à la douleur) : ischios, quadriceps, fessiers, mollets, pectoraux et dorsaux."
          }
        ]
      },
      volley_mercredi: {
        title: "Volley-ball",
        warmup: "<strong>Focus du jour :</strong> Séance volley milieu de semaine. Garde du jus pour le jeudi et le renfo du vendredi.",
        exercises: [
          {
            id: "vol_mer_1",
            name: "Séance Volley-ball",
            sets: "Séance",
            reps: "Complète",
            rest: "-",
            desc: "Focus qualité des appuis, placement et récupération active après l'entraînement."
          }
        ]
      },
      volley_jeudi: {
        title: "Volley + Étirements",
        warmup: "<strong>Focus du jour :</strong> Entraînement volley + étirements pour relâcher les tensions avant le renfo haut du corps de vendredi.",
        exercises: [
          {
            id: "vol_jeu_1",
            name: "Séance Volley-ball",
            sets: "Séance",
            reps: "Complète",
            rest: "-",
            desc: "Entraînement complet. Pense à bien relâcher les épaules en fin de séance."
          },
          {
            id: "vol_jeu_2",
            name: "Routine Étirements",
            sets: "15 min",
            reps: "30-45s / muscle",
            rest: "-",
            desc: "Mobilité thoracique, étirement des fléchisseurs de hanche, ischios et chaîne postérieure."
          }
        ]
      },
      samedi_match: {
        title: "Match Volley (ou HIIT)",
        warmup: "<strong>Règle d'or :</strong> Si tu ressens de la fatigue, lève le pied sur le HIIT et <strong>priorise impérativement le renfo jambes de dimanche</strong> !",
        exercises: [
          {
            id: "sam_1",
            name: "Match de Volley (ou séance HIIT)",
            sets: "Match",
            reps: "100 % focus",
            rest: "-",
            desc: "Si pas de match : fais une séance HIIT courte uniquement si tu es frais. Sinon, repos actif pour être explosif dimanche sur le BBL."
          }
        ]
      }
    };

    // Planning hebdomadaire (0 = Dimanche, 1 = Lundi, ..., 6 = Samedi)
    const WEEKLY_SCHEDULE = {
      1: { dayName: "Lundi", defaultBlocks: ["volley_lundi"] },
      2: { dayName: "Mardi", defaultBlocks: ["hc1", "abs"], allowHcSwitch: true, allowTractions: true, note: "Pas d'étirements après le renfo (si tu veux en faire, c'est 2h avant) + 10/15 min de gainage." },
      3: { dayName: "Mercredi", defaultBlocks: ["volley_mercredi"] },
      4: { dayName: "Jeudi", defaultBlocks: ["volley_jeudi"] },
      5: { dayName: "Vendredi", defaultBlocks: ["hc2", "abs"], allowHcSwitch: true, allowFatigueMode: true, allowTractions: true, note: "Fais l'autre séance Haut du Corps. Si trop de fatigue : active le mode Repos + Gainage uniquement." },
      6: { dayName: "Samedi", defaultBlocks: ["samedi_match"] },
      0: { dayName: "Dimanche", defaultBlocks: ["bbl", "abs"], allowTractions: true, note: "Renfo jambes & explosivité + séance gainage." }
    };

    // ==========================================
    // ÉTAT DE L'APPLICATION & STOCKAGE LOCAL
    // ==========================================
    const STORAGE_KEY = "prepa4sem_data_v1";
    let appState = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      completed: {}, // { "YYYY-MM-DD": ["exo_id_1", "exo_id_2"] }
      prefs: {}      // { "YYYY-MM-DD": { hc: "hc1", fatigue: false, tractions: false } }
    };

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    }

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let selectedDate = new Date(today);
    let calendarMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    let activeModalExo = null;

    function getDayPrefs(dateKey, dow) {
      if (!appState.prefs[dateKey]) {
        appState.prefs[dateKey] = {
          hc: dow === 5 ? "hc2" : "hc1",
          fatigue: false,
          tractions: false
        };
      }
      return appState.prefs[dateKey];
    }

    function getBlocksForDate(date) {
      const dow = date.getDay();
      const dateKey = formatDateKey(date);
      const sched = WEEKLY_SCHEDULE[dow];
      const prefs = getDayPrefs(dateKey, dow);

      let blockKeys = [...sched.defaultBlocks];

      if (sched.allowHcSwitch) {
        blockKeys = blockKeys.map(k => (k === "hc1" || k === "hc2") ? prefs.hc : k);
      }

      if (sched.allowFatigueMode && prefs.fatigue) {
        blockKeys = ["abs"];
      }

      if (sched.allowTractions && prefs.tractions && !(sched.allowFatigueMode && prefs.fatigue)) {
        blockKeys.push("tractions");
      }

      return blockKeys;
    }

    function getExercisesForDate(date) {
      const blockKeys = getBlocksForDate(date);
      let all = [];
      blockKeys.forEach(bk => {
        if (WORKOUT_BLOCKS[bk]) {
          all = all.concat(WORKOUT_BLOCKS[bk].exercises);
        }
      });
      return all;
    }

    function isDayFullyCompleted(date) {
      const dateKey = formatDateKey(date);
      const exos = getExercisesForDate(date);
      if (exos.length === 0) return false;
      const doneList = appState.completed[dateKey] || [];
      return exos.every(ex => doneList.includes(ex.id));
    }

    // ==========================================
    // RENDU DE LA VUE DU JOUR
    // ==========================================
    function renderWeekStrip() {
      const strip = document.getElementById("weekStrip");
      strip.innerHTML = "";

      // Trouver le lundi de la semaine de selectedDate
      const currentDow = selectedDate.getDay();
      const diffToMonday = currentDow === 0 ? -6 : 1 - currentDow;
      const monday = new Date(selectedDate);
      monday.setDate(selectedDate.getDate() + diffToMonday);

      const shortDays = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const key = formatDateKey(d);
        const isSelected = key === formatDateKey(selectedDate);
        const isToday = key === formatDateKey(today);
        const completed = isDayFullyCompleted(d);

        const btn = document.createElement("button");
        btn.className = `day-btn ${isSelected ? "active" : ""} ${isToday ? "today-marker" : ""}`;
        btn.innerHTML = `
          <span>${shortDays[i]}</span>
          <span class="num">${d.getDate()}</span>
          <span class="day-dot ${completed ? "completed" : ""}"></span>
        `;
        btn.onclick = () => {
          selectedDate = d;
          renderAll();
        };
        strip.appendChild(btn);
      }
    }

    function renderWorkoutView() {
      const dateKey = formatDateKey(selectedDate);
      const dow = selectedDate.getDay();
      const sched = WEEKLY_SCHEDULE[dow];
      const prefs = getDayPrefs(dateKey, dow);
      const blockKeys = getBlocksForDate(selectedDate);

      // Date header
      const optionsDate = { weekday: "long", day: "numeric", month: "long" };
      document.getElementById("currentDateLabel").textContent = selectedDate.toLocaleDateString("fr-FR", optionsDate);

      // Banner
      document.getElementById("dayNameTag").textContent = sched.dayName;
      const titles = blockKeys.map(k => WORKOUT_BLOCKS[k].title);
      document.getElementById("sessionTitle").textContent = (sched.allowFatigueMode && prefs.fatigue)
        ? "Repos + Gainage (Mode Fatigue)"
        : titles.join(" + ");

      document.getElementById("sessionNote").textContent = sched.note || "Valide chaque exercice une fois terminé.";

      // Options Bar (HC1/HC2, Mode Fatigue, Tractions)
      const optionsBar = document.getElementById("optionsBar");
      optionsBar.innerHTML = "";
      let hasOptions = false;

      if (sched.allowHcSwitch && !(sched.allowFatigueMode && prefs.fatigue)) {
        hasOptions = true;
        ["hc1", "hc2"].forEach(hcKey => {
          const btn = document.createElement("button");
          btn.className = `chip-btn ${prefs.hc === hcKey ? "selected" : ""}`;
          btn.textContent = hcKey === "hc1" ? "Haut du Corps 1" : "Haut du Corps 2";
          btn.onclick = () => {
            prefs.hc = hcKey;
            saveState();
            renderAll();
          };
          optionsBar.appendChild(btn);
        });
      }

      if (sched.allowFatigueMode) {
        hasOptions = true;
        const fatBtn = document.createElement("button");
        fatBtn.className = `chip-btn ${prefs.fatigue ? "selected" : ""}`;
        fatBtn.textContent = prefs.fatigue ? "Mode Fatigue : ACTIVÉ" : "Mode Fatigue (Repos + Abs)";
        fatBtn.onclick = () => {
          prefs.fatigue = !prefs.fatigue;
          saveState();
          renderAll();
        };
        optionsBar.appendChild(fatBtn);
      }

      if (sched.allowTractions && !(sched.allowFatigueMode && prefs.fatigue)) {
        hasOptions = true;
        const tracBtn = document.createElement("button");
        tracBtn.className = `chip-btn ${prefs.tractions ? "selected" : ""}`;
        tracBtn.textContent = prefs.tractions ? "+ Tractions (Inclus)" : "+ Ajouter Tractions";
        tracBtn.onclick = () => {
          prefs.tractions = !prefs.tractions;
          saveState();
          renderAll();
        };
        optionsBar.appendChild(tracBtn);
      }

      optionsBar.classList.toggle("hidden", !hasOptions);

      // Warmup / Consignes du bloc principal
      const primaryBlock = WORKOUT_BLOCKS[blockKeys[0]];
      document.getElementById("warmupBox").innerHTML = primaryBlock.warmup;

      // Render Exercise Sections
      const container = document.getElementById("exerciseSections");
      container.innerHTML = "";
      const doneList = appState.completed[dateKey] || [];
      let totalExos = 0;
      let doneCount = 0;

      blockKeys.forEach((bk, idx) => {
        const block = WORKOUT_BLOCKS[bk];
        if (blockKeys.length > 1) {
          const secTitle = document.createElement("div");
          secTitle.className = "block-title";
          secTitle.textContent = block.title;
          container.appendChild(secTitle);
        }

        const listEl = document.createElement("div");
        listEl.className = "exo-list";

        block.exercises.forEach(exo => {
          totalExos++;
          const isChecked = doneList.includes(exo.id);
          if (isChecked) doneCount++;

          const item = document.createElement("div");
          item.className = `exo-item ${isChecked ? "checked" : ""}`;

          // Zone nom uniquement -> ouvre les détails
          const nameArea = document.createElement("div");
          nameArea.className = "exo-name-area";
          nameArea.innerHTML = `
            <span class="exo-name">${exo.name}</span>
            <span class="exo-chevron">Détails ›</span>
          `;
          nameArea.onclick = () => openExerciseModal(exo, dateKey);

          // Bouton validation rapide
          const checkBtn = document.createElement("button");
          checkBtn.className = "check-btn";
          checkBtn.setAttribute("aria-label", "Valider l'exercice");
          checkBtn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
          checkBtn.onclick = (e) => {
            e.stopPropagation();
            toggleExerciseDone(dateKey, exo.id);
          };

          item.appendChild(nameArea);
          item.appendChild(checkBtn);
          listEl.appendChild(item);
        });

        container.appendChild(listEl);
      });

      // Header Progress Pill
      const pill = document.getElementById("headerProgress");
      pill.textContent = `${doneCount} / ${totalExos}`;
      pill.classList.toggle("done", totalExos > 0 && doneCount === totalExos);
    }

    function toggleExerciseDone(dateKey, exoId) {
      if (!appState.completed[dateKey]) {
        appState.completed[dateKey] = [];
      }
      const idx = appState.completed[dateKey].indexOf(exoId);
      if (idx === -1) {
        appState.completed[dateKey].push(exoId);
      } else {
        appState.completed[dateKey].splice(idx, 1);
      }
      saveState();
      renderAll();
    }

    // ==========================================
    // MODALE DÉTAILS EXERCICE
    // ==========================================
    function openExerciseModal(exo, dateKey) {
      activeModalExo = { exo, dateKey };
      document.getElementById("modalTitle").textContent = exo.name;
      document.getElementById("modalSets").textContent = exo.sets;
      document.getElementById("modalReps").textContent = exo.reps;
      document.getElementById("modalRest").textContent = exo.rest;
      document.getElementById("modalDesc").textContent = exo.desc;

      const isDone = (appState.completed[dateKey] || []).includes(exo.id);
      const toggleBtn = document.getElementById("toggleDoneModalBtn");
      toggleBtn.textContent = isDone ? "Annuler la validation" : "Valider cet exercice";
      toggleBtn.style.background = isDone ? "#ef4444" : "var(--accent)";
      toggleBtn.style.color = isDone ? "#fff" : "#052e16";

      document.getElementById("exoModal").classList.add("open");
    }

    function closeExerciseModal() {
      document.getElementById("exoModal").classList.remove("open");
      activeModalExo = null;
    }

    document.getElementById("closeModalBtn").onclick = closeExerciseModal;
    document.getElementById("exoModal").onclick = (e) => {
      if (e.target.id === "exoModal") closeExerciseModal();
    };
    document.getElementById("toggleDoneModalBtn").onclick = () => {
      if (activeModalExo) {
        toggleExerciseDone(activeModalExo.dateKey, activeModalExo.exo.id);
        closeExerciseModal();
      }
    };

    // ==========================================
    // VUE CALENDRIER MENSUEL
    // ==========================================
    function renderCalendar() {
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();

      const titleStr = calendarMonth.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
      document.getElementById("calMonthTitle").textContent = titleStr;

      const grid = document.getElementById("calGrid");
      grid.innerHTML = "";

      // Premier jour du mois (0 = Dimanche -> convertir en Lundi = 0)
      const firstDayDow = new Date(year, month, 1).getDay();
      const startOffset = firstDayDow === 0 ? 6 : firstDayDow - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startOffset; i++) {
        const empty = document.createElement("div");
        empty.className = "cal-cell empty";
        grid.appendChild(empty);
      }

      const todayKey = formatDateKey(today);
      const selectedKey = formatDateKey(selectedDate);

      for (let day = 1; day <= daysInMonth; day++) {
        const cellDate = new Date(year, month, day);
        const cellKey = formatDateKey(cellDate);
        const isToday = cellKey === todayKey;
        const isSelected = cellKey === selectedKey;
        const completed = isDayFullyCompleted(cellDate);

        const cell = document.createElement("div");
        cell.className = `cal-cell ${isToday ? "is-today" : ""} ${isSelected ? "is-selected" : ""}`;
        cell.innerHTML = `
          <span>${day}</span>
          <span class="cal-badge ${completed ? "green" : ""}"></span>
        `;

        cell.onclick = () => {
          selectedDate = cellDate;
          switchTab("today");
          renderAll();
        };

        grid.appendChild(cell);
      }
    }

    document.getElementById("prevMonthBtn").onclick = () => {
      calendarMonth.setMonth(calendarMonth.getMonth() - 1);
      renderCalendar();
    };

    document.getElementById("nextMonthBtn").onclick = () => {
      calendarMonth.setMonth(calendarMonth.getMonth() + 1);
      renderCalendar();
    };

    // ==========================================
    // NAVIGATION ONGLETS
    // ==========================================
    function switchTab(tab) {
      const isToday = tab === "today";
      document.getElementById("todayView").classList.toggle("hidden", !isToday);
      document.getElementById("calendarView").classList.toggle("hidden", isToday);
      document.getElementById("navToday").classList.toggle("active", isToday);
      document.getElementById("navCalendar").classList.toggle("active", !isToday);

      if (!isToday) {
        calendarMonth = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
        renderCalendar();
      }
    }

    document.getElementById("navToday").onclick = () => switchTab("today");
    document.getElementById("navCalendar").onclick = () => switchTab("calendar");

    function renderAll() {
      renderWeekStrip();
      renderWorkoutView();
      renderCalendar();
    }

    renderAll();
  </script>
